<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dread Keep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one column like a handheld screen. Fixed top: title bar, news ticker, the overworld map, the orb + counter.
   Below it a scrolling list that grows as the game reveals itself. Deliberately single dark theme: an 8-bit night. */
:root{
  --bg:#0e0b16; --panel:#19132a; --panel2:#251b3a; --line:#efe6d2; --text:#efe6d2; --muted:#9a8fb2;
  --mal:#c46cff; --gold:#f7d354; --hp:#e5484d; --good:#6fd35a; --ess:#7fe0ff;
  --pix:'Press Start 2P','Courier New',monospace; --body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:20px;line-height:1.15;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) 0}
.bar{display:flex;align-items:center;gap:8px;flex:none}
.bar h1{white-space:nowrap;font-family:var(--pix);font-size:13px;font-weight:400;margin:0;color:var(--mal);letter-spacing:.06em;text-shadow:2px 2px 0 #000}
.bar .realm{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.pbtn{font-family:var(--pix);font-size:10px;color:var(--text);background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 #000;padding:6px 8px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.pbtn:active{transform:translate(2px,2px);box-shadow:none}
.pbtn.ess{color:var(--ess)}
.sym{font-family:var(--body);font-size:1.9em;line-height:0;vertical-align:-.12em;margin-right:.15em}
.pbtn:focus-visible,.item:focus-visible,.utile:focus-visible,#orb:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
.ticker{flex:none;font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:2px dotted #3a2f55;padding-bottom:4px;transition:opacity .4s}
.mapwrap{position:relative;flex:none;border:3px solid var(--line);box-shadow:0 0 0 3px #000,4px 4px 0 3px #000;background:#000;line-height:0}
#map{display:block;width:100%;height:auto;max-height:36vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}
.core{flex:none;display:flex;align-items:center;gap:14px;position:relative;padding:2px 0}
#orb{flex:none;width:96px;height:96px;padding:0;border:none;background:none;cursor:pointer;touch-action:manipulation;transition:transform .07s}
#orb.bump{transform:scale(.9)}
#orbc{width:96px;height:96px;image-rendering:pixelated;display:block}
.count{min-width:0;flex:1}
.mal{font-family:var(--pix);font-size:clamp(14px,4.6vw,20px);color:var(--text);text-shadow:2px 2px 0 #000;word-break:break-word;line-height:1.3;font-variant-numeric:tabular-nums}
.lbl{font-size:18px;color:var(--mal)}
.ps{font-size:19px;color:var(--muted)}
.extra{font-size:17px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:2px}
.extra .cho{color:var(--gold)}
.pill{font-family:var(--pix);font-size:9px;padding:3px 5px;border:2px solid currentColor;color:var(--gold);animation:blink 1s steps(2) infinite}
.pill.s{color:#ff7ad9}
@keyframes blink{50%{opacity:.6}}
.float{position:absolute;font-family:var(--pix);font-size:11px;color:var(--mal);text-shadow:1px 1px 0 #000;pointer-events:none;animation:up 1s ease-out forwards;white-space:nowrap;z-index:5}
.float.dmg{color:#fff}.float.gold{color:var(--gold)}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 120px;overscroll-behavior:contain}
.hint{font-family:var(--pix);font-size:11px;color:var(--gold);text-align:center;padding:18px 0;animation:blink 1.2s steps(2) infinite;line-height:1.6}
h2{font-family:var(--pix);font-size:11px;font-weight:400;margin:0 0 8px;color:var(--gold);letter-spacing:.05em;line-height:1.5}
h3{font-family:var(--pix);font-size:10px;font-weight:400;margin:6px 0 4px;color:var(--ess);letter-spacing:.05em}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mult{display:flex;gap:4px}
.mult .pbtn{padding:4px 6px;font-size:9px}
.mult .pbtn.on{background:var(--mal);color:#000}
.store{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 #000;padding:6px 10px 6px 6px;cursor:pointer;touch-action:manipulation}
.item:active:not(.no){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.item.no{opacity:.5;cursor:default}
.item.unk{border-style:dashed}
.item.unk .nm{color:var(--muted)}
.item canvas{width:44px;height:44px;image-rendering:pixelated;background:#0b0912;border:2px solid #3a2f55}
.item .nm{font-family:var(--pix);font-size:10px;line-height:1.4;color:var(--text)}
.item .cs{font-size:19px;color:var(--mal)}
.item .cs.no{color:#8a6b9a}
.item .sb{font-size:16px;color:var(--muted)}
.item .ow{font-family:var(--pix);font-size:16px;color:#5d5078}
.ups{display:flex;flex-wrap:wrap;gap:6px}
.utile{width:46px;height:46px;padding:0;border:2px solid var(--line);background:#0b0912;cursor:pointer;box-shadow:2px 2px 0 #000;touch-action:manipulation}
.utile canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.utile.no{opacity:.45}
.utile.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.uinfo{margin-top:8px;background:var(--panel);border:2px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.uinfo b{font-family:var(--pix);font-size:10px;font-weight:400;color:var(--gold);line-height:1.5}
.box{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #000;padding:12px}
.box p{margin:4px 0}
.box.gold{border-color:var(--gold)}
.big{width:100%;font-size:11px;padding:10px;margin-top:6px}
.go{background:var(--mal);color:#000}
.go:disabled{background:var(--panel2);color:var(--muted);cursor:default}
.note{color:var(--muted);font-size:17px}
.meter{display:flex;gap:4px;margin:6px 0}
.meter i{flex:1;height:12px;border:2px solid var(--line);background:#0b0912}
.meter i.on{background:var(--gold)}
.meter i.best{background:#5d5078}
.cracks{color:var(--hp)}
.art{border:2px solid #3a2f55;padding:8px;display:flex;flex-direction:column;gap:2px}
.art .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.art b{font-family:var(--pix);font-size:9px;font-weight:400;color:var(--text);line-height:1.5}
.art .lv{font-family:var(--pix);font-size:9px;color:var(--ess);white-space:nowrap}
.art .pbtn{align-self:flex-end;font-size:9px}
#dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(calc(100% - 32px),508px);z-index:30;background:#000;border:3px solid var(--line);box-shadow:0 0 0 3px #000,0 6px 0 3px rgba(0,0,0,.5);padding:12px 14px 22px;font-size:20px;line-height:1.2;cursor:pointer}
#dlg::after{content:"▼";position:absolute;right:12px;bottom:4px;font-size:12px;color:var(--gold);animation:blink .8s steps(2) infinite}
#dlg b{color:var(--gold);font-weight:400}
#modal{position:fixed;inset:0;z-index:40;background:rgba(5,3,10,.8);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
#mbox{max-width:460px;width:100%;max-height:84vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#mbox h2{font-size:13px}
.ach{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;font-size:18px}
.ach .st{font-size:18px;color:var(--gold)}
.ach.off{color:#5d5078}.ach.off .st{color:#3a2f55}
textarea{font-family:var(--body);font-size:16px;background:#0b0912;color:var(--text);border:2px solid var(--line);padding:6px;min-height:56px;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <h1>DREAD KEEP</h1><span class="realm" id="realmLbl"></span><span class="sp"></span>
    <button class="pbtn ess" id="essBtn" data-act="arts" hidden>✦0</button>
    <button class="pbtn" id="infBtn" data-act="inf" hidden>★0</button>
    <button class="pbtn" data-act="opt" aria-label="options">≡</button>
  </header>
  <div class="ticker" id="ticker">The kingdom of Eldmoor is peaceful.</div>
  <div class="mapwrap" id="mapwrap"><canvas id="map" width="192" height="120" aria-label="The realm, seen from above. Your keep is top right; heroes come from the bottom left."></canvas></div>
  <section class="core" id="core">
    <button id="orb" aria-label="Tap the orb to gather malice"><canvas id="orbc" width="32" height="32"></canvas></button>
    <div class="count">
      <div class="mal" id="mal">0</div>
      <div class="lbl">malice</div>
      <div class="ps" id="ps" hidden></div>
      <div class="extra" id="extra"></div>
    </div>
  </section>
  <div class="scroll" id="scroll">
    <div class="hint" id="hint">TAP THE ORB</div>
    <section id="choSec" hidden></section>
    <section id="upSec" hidden><h2>UPGRADES</h2><div class="ups" id="ups"></div><div id="uinfo"></div></section>
    <section id="storeSec" hidden>
      <div class="row"><h2>SUMMON MINIONS</h2><div class="mult" id="mult" hidden></div></div>
      <div class="store" id="store"></div>
    </section>
    <section id="sealSec" hidden></section>
  </div>
</div>
<div id="dlg" hidden></div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NAMES=['','thousand','million','billion','trillion','quadrillion','quintillion','sextillion','septillion','octillion','nonillion','decillion','undecillion','duodecillion'];
const SH=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc'];
function fmtL(n){if(n<1e6)return Math.floor(n).toLocaleString('en-US');let i=0;while(n>=1000&&i<NAMES.length-1){n/=1000;i++}return n.toFixed(3)+' '+NAMES[i]}
function fmt(n){if(n<1000)return n<100&&n%1?(Math.floor(n*10)/10).toString():Math.floor(n).toString();let i=0;while(n>=1000&&i<SH.length-1){n/=1000;i++}return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+SH[i]}
function ft(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:m?`${m}m ${s%60}s`:`${s}s`}

/* ================= DATA ================= */
const REALMS=[
 {n:'Eldmoor',title:'the Kingdom of Eldmoor',kind:'kingdom',req:1e9,need:5,unlock:11,origin:'the village'},
 {n:'Varrow',title:'the Continent of Varrow',kind:'continent',req:1e13,need:6,unlock:14,origin:'the High King’s city'},
 {n:'the World',title:'the Whole World',kind:'world',req:1e17,need:7,unlock:17,origin:'the far shore'},
 {n:'the Heavens',title:'the Heavens',kind:'heavens',req:1e21,need:8,unlock:19,origin:'the Sun'}
];
const B=[
 {id:'slime',n:'Slime',pl:'Slimes',cost:15,p:.1,d:'A wobbly blob of pure spite.'},
 {id:'bat',n:'Bat Swarm',pl:'Bat Swarms',cost:100,p:1,d:'Screeching shadows that sour the night.'},
 {id:'skel',n:'Skeleton',pl:'Skeletons',cost:1100,p:8,d:'Rattles around frightening sheep.'},
 {id:'goblin',n:'Goblin Camp',pl:'Goblin Camps',cost:12000,p:47,d:'Raids caravans and sends you a cut.'},
 {id:'dungeon',n:'Dungeon',pl:'Dungeons',cost:130000,p:260,d:'Traps, puzzles, and the key is always in the wrong room.'},
 {id:'grave',n:'Haunted Graveyard',pl:'Graveyards',cost:1.4e6,p:1400,d:'The dead don’t rest. They work night shifts.'},
 {id:'temple',n:'Cursed Temple',pl:'Cursed Temples',cost:2e7,p:7800,d:'Cultists chant your name. Flattering.'},
 {id:'fort',n:'Dark Fortress',pl:'Dark Fortresses',cost:3.3e8,p:44000,d:'Spiky towers looming on the horizon.'},
 {id:'dragon',n:'Dragon',pl:'Dragons',cost:5.1e9,p:260000,d:'Burns things. Sleeps on gold. Very on-brand.'},
 {id:'portal',n:'Shadow Portal',pl:'Shadow Portals',cost:7.5e10,p:1.6e6,d:'A rift to a dimension made of bad vibes.'},
 {id:'eclipse',n:'Eclipse Engine',pl:'Eclipse Engines',cost:1e12,p:1e7,d:'A machine that dims the sun. A prototype.'},
 {id:'lich',n:'Lich Citadel',pl:'Lich Citadels',cost:1.4e13,p:6.5e7,d:'Undead scholars who never take a day off.'},
 {id:'serpent',n:'Sea Serpent',pl:'Sea Serpents',cost:1.7e14,p:4.3e8,d:'Sinks ships, keeps the treasure.'},
 {id:'titan',n:'Titan Forge',pl:'Titan Forges',cost:2.1e15,p:2.9e9,d:'Giants hammering out armies of iron.'},
 {id:'miasma',n:'Miasma Cloud',pl:'Miasma Clouds',cost:2.6e16,p:2.1e10,d:'A fog of gloom that drifts across oceans.'},
 {id:'moon',n:'Moon Siphon',pl:'Moon Siphons',cost:3.1e17,p:1.5e11,d:'Drains the moonlight. Werewolves are furious.'},
 {id:'wserp',n:'World Serpent',pl:'World Serpents',cost:3.7e18,p:1.1e12,d:'Wraps around the planet and squeezes.'},
 {id:'stareater',n:'Star Eater',pl:'Star Eaters',cost:4.4e19,p:8.3e12,d:'Swallows constellations whole.'},
 {id:'snuffer',n:'Sun Snuffer',pl:'Sun Snuffers',cost:5.2e20,p:6.4e13,d:'A very, very large candle snuffer.'}
];
const UN={
 slime:['Stickier Ooze','Slime Mitosis','Royal Jelly','Gelatinous Cubes','The Slime King'],
 bat:['Echo Screech','Vampire Fangs','Night Wings','Bat Cathedral','Eternal Twilight'],
 skel:['Rattling Bones','Rusty Swords','Bone Armor','Marrow Magic','Army of the Grave'],
 goblin:['Spiky Clubs','Goblin Greed','War Drums','Goblin Engineers','Goblin Warlord'],
 dungeon:['Spike Pits','Rolling Boulders','Pushable Blocks','Keys in Wrong Rooms','Labyrinth Masters'],
 grave:['Restless Dead','Fog Machines','Wailing Ghosts','Bone Harvest','Necropolis'],
 temple:['Cursed Idols','Dark Rituals','Blood Moon Altar','Forbidden Scriptures','High Priest of Woe'],
 fort:['Iron Portcullis','Lava Moat','Gargoyle Sentinels','Siege Engines','Citadel of Night'],
 dragon:['Dragon Eggs','Hoard of Gold','Fire Breath','Elder Wyrms','Dragon Emperor'],
 portal:['Unstable Rifts','Void Whispers','Shadow Legions','Dimensional Anchors','The Other Side'],
 eclipse:['Solar Shroud','Moon Gears','Total Darkness','Eternal Night','The Last Sunset'],
 lich:['Phylactery Vaults','Bone Libraries','Soul Lanterns','Undying Council','The Archlich'],
 serpent:['Salt Fangs','Whirlpool Coils','Shipwreck Hoards','Abyssal Brood','Leviathan'],
 titan:['Bellows of Ash','Iron Giants','Mountain Hammers','Forge of Ages','Titan King'],
 miasma:['Stale Air','Wilting Winds','Grey Fog','Endless Haze','The Great Miasma'],
 moon:['Lunar Tides','Silver Drain','Tidal Pull','The Dark Side','Moon Harvest'],
 wserp:['Ring of Scales','Tail Bite','Continental Coil','World Crush','Ouroboros'],
 stareater:['Stardust Snacks','Comet Gulp','Nebula Feast','Galaxy Bites','Void Glutton'],
 snuffer:['Brass Handle','Long Reach','Solar Cap','Eternal Dusk','Lights Out']
};
const TIERS=[[1,10],[5,50],[25,500],[50,5e4],[100,5e6]];
const U=[];
B.forEach(b=>TIERS.forEach(([n,m],i)=>U.push({id:b.id+i,n:UN[b.id][i],d:`${b.pl} make twice as much malice.`,cost:b.cost*m,req:()=>S.own[b.id]>=n,ic:b.id,tier:i,b:b.id})));
U.push(
 {id:'c1',n:'Cursed Fingertip',d:'Tapping the orb gives twice as much.',cost:100,req:()=>M.st.taps>=40,ic:'hand',click2:1},
 {id:'c2',n:'Wicked Knuckles',d:'Tapping the orb gives twice as much.',cost:500,req:()=>S.own.slime>=5,ic:'hand',click2:1},
 {id:'c3',n:'Gauntlet of Spite',d:'Each tap also gives 1% of your malice per second.',cost:1e4,req:()=>S.own.skel>=1,ic:'hand',pct:.01},
 {id:'c4',n:'Hand of Doom',d:'Each tap gives another 1% of your malice per second.',cost:1e6,req:()=>S.own.dungeon>=1,ic:'hand',pct:.01},
 {id:'c5',n:'Tyrant’s Grip',d:'Each tap gives another 2% of your malice per second.',cost:1e8,req:()=>S.own.temple>=1,ic:'hand',pct:.02},
 {id:'c6',n:'Fist of the Eclipse',d:'Each tap gives another 3% of your malice per second.',cost:1e11,req:()=>S.own.dragon>=1,ic:'hand',pct:.03},
 {id:'h1',n:'Spiked Road',d:'Your minions hit heroes twice as hard.',cost:2000,req:()=>M.st.slain>=3,ic:'sword',army:2},
 {id:'h2',n:'Bounty on Heroes',d:'Defeated heroes drop twice as much malice.',cost:2e4,req:()=>M.st.slain>=10,ic:'sword',loot:2},
 {id:'h3',n:'Ambush Tactics',d:'Heroes walk 30% slower, so your minions get more hits in.',cost:2e5,req:()=>M.st.slain>=20,ic:'sword',slow:1},
 {id:'h4',n:'Mirror Traps',d:'Your minions hit heroes 3× as hard.',cost:5e7,req:()=>M.st.slain>=40,ic:'sword',army:3},
 {id:'h5',n:'Trophy Room',d:'+1% malice for every 5 heroes you have ever defeated (up to +100%).',cost:1e9,req:()=>M.st.slain>=75,ic:'sword',trophy:1},
 {id:'f1',n:'Fairy Nets',d:'Fairies show up twice as often.',cost:7777,req:()=>M.st.fairies>=3,ic:'fairy'},
 {id:'f2',n:'Bottled Fairies',d:'Fairy effects last twice as long.',cost:777777,req:()=>M.st.fairies>=7,ic:'fairy'},
 {id:'i1',n:'Evil Laugh',d:'Each infamy star gives another +1% malice.',cost:9e5,req:()=>achCount()>=15,ic:'star'},
 {id:'i2',n:'Grand Monologue',d:'Each infamy star gives another +2% malice.',cost:9e9,req:()=>achCount()>=35,ic:'star'}
);
/* Dark Arts: bought with essence. Every level costs more than the last. */
const ARTS=[
 {g:'Power',id:'momentum',n:'Dark Momentum',d:'+25% malice per level.',b:2,x:1.45,max:40},
 {g:'Power',id:'swift',n:'Swift Summoning',d:'Minions cost 3% less per level.',b:3,x:1.6,max:10},
 {g:'Power',id:'touch',n:'Cursed Touch',d:'Orb taps ×2 per level.',b:1,x:2,max:6},
 {g:'Power',id:'legions',n:'Remembered Legions',d:'Start each reign with 10 of one more minion type per level, Slimes first.',b:3,x:1.8,max:8},
 {g:'Power',id:'hoard',n:'Buried Hoard',d:'Start each reign with malice: 1,000 at level 1, ×10 each level after.',b:2,x:1.7,max:8},
 {g:'Heroes',id:'bane',n:'Bane of Heroes',d:'You and your minions hit heroes 1.5× harder per level.',b:2,x:1.5,max:25},
 {g:'Heroes',id:'bounty',n:'Hero Bounties',d:'Defeated heroes drop +50% malice per level.',b:2,x:1.6,max:5},
 {g:'Heroes',id:'omens',n:'Delaying Omens',d:'The Chosen One waits 20% longer between visits per level.',b:4,x:1.8,max:5},
 {g:'Heroes',id:'walls',n:'Thick Walls',d:'Your keep survives one more crack from the Chosen One per level.',b:8,x:2.5,max:3},
 {g:'Fortune',id:'fairy',n:'Fairy Lure',d:'Fairies show up 25% more often per level.',b:2,x:1.6,max:5},
 {g:'Fortune',id:'lore',n:'Fairy Lore',d:'Fairy effects last 25% longer per level.',b:3,x:1.6,max:5},
 {g:'Fortune',id:'patient',n:'Patient Evil',d:'+10% malice while you’re away per level (starts at 50%).',b:2,x:1.5,max:5},

 m.PATH=ROADW.map(([x,y])=>[x*8+4,y*8+4]);m.PLEN=[];m.PTOT=0;
 for(let i=0;i<m.PATH.length-1;i++){const l=Math.hypot(m.PATH[i+1][0]-m.PATH[i][0],m.PATH[i+1][1]-m.PATH[i][1]);m.PLEN.push(l);m.PTOT+=l}

 for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const T=tiles[y][x],d=Math.hypot(x-CAST[0],y-CAST[1]),o={x,y,d,key:x+','+y};

function heroTier(d){let r=HTIER[0];for(const x of HTIER)if(d>=x[0])r=x;return r}
const heroName=h=>h.cho?'The Chosen One':heroTier(h.d)[1];
function spawnHero(){const d=S.heroLv,champ=d%10===9,hp=150*Math.pow(1.5,d)*(champ?4:1);S.hero={d,hp,max:hp,t:0,champ}}
/* The Chosen One is sized to your army at the moment he is born (this reign's upgrades, not your Dark Arts),
   then grows on his own: ×2.5 to ×3.8 (by realm) every time you beat him. Bane of Heroes is what lets you outgrow him. */
const CHO_GS=[2.5,3,3.8,3.8];
const choG=()=>CHO_GS[Math.min(M.realm,3)];
function choBase(){return Math.max(1000,(.5*C.P+.5)*C.armyRun*32*(S.up.h3?1.3:1)*10)}
function spawnChosen(){const k=S.cho.k,hp=S.cho.base*Math.pow(choG(),k);S.hero={cho:1,d:99,hp,max:hp,t:0,k}}
function tapHero(){calc();const d=C.click*2+armyDps()*1.5;S.hero.hp-=d;if(S.hero.hp<=0)heroDefeated();return d}
function heroDefeated(){
 const h=S.hero,p=pathAt(h.t);
 if(h.cho){
  const g=Math.max(C.P*120,h.max*.6)*C.loot;earn(g);S.cho.wins++;S.cho.k++;M.st.chosen++;M.best[Math.min(M.realm,3)]=Math.max(M.best[Math.min(M.realm,3)]||0,S.cho.wins);
  floatMap(p[0],p[1]-10,'+'+fmt(g),'gold');S.hero=null;S.cho.t=choInterval();
  if(S.cho.wins>=R0().need&&M.realm<4){conquer();return}
  toastLine(`The Chosen One fell! (${S.cho.wins}/${R0().need}) +${fmt(g)} malice, +2 essence when you seal. He’ll be back, stronger.`);return}
 const g=Math.max(10,C.P*30,h.max*.6)*(h.champ?3:1)*C.loot;earn(g);M.st.slain++;if(h.champ)M.st.champs++;S.heroLv++;
 floatMap(p[0],p[1]-10,'+'+fmt(g),'gold');
 toastLine(`${heroName(h)}${h.champ?' (Champion)':''} defeated! +${fmt(g)} malice`);
 S.hero=null;S.heroT=rand(35,60);
}
function heroReached(){
 const h=S.hero;S.hero=null;
 if(h.cho){S.cho.cracks++;S.cho.t=choInterval();
  if(S.cho.cracks>=maxCracks()){forcedSeal();return}
  toastLine(`The Chosen One struck your keep! Cracks: ${S.cho.cracks}/${maxCracks()}. At ${maxCracks()} you are sealed.`,1);return}
 const steal=Math.min(S.malice*.08,C.P*90+5);S.malice=Math.max(0,S.malice-steal);M.st.reached++;S.heroLv=Math.max(0,S.heroLv-1);S.heroT=rand(35,60);
 toastLine(`The ${heroName(h)} reached your keep, smashed your pots and took ${fmt(steal)} malice!`,1);
}
function catchFairy(){
 const f=S.fairy,mult=(S.up.f2?2:1)*(1+.25*lv('lore'));S.fairy=null;M.st.fairies++;
 const r=Math.random();
 if(S.up.c3&&r<.12){S.buff.surge=10*mult;toastLine(`Fairy caught: DARK SURGE! Taps ×777 for ${Math.round(10*mult)}s. Tap the orb!`)}
 else if(r<.55){S.buff.frenzy=60*mult;toastLine(`Fairy caught: FRENZY! Malice ×7 for ${Math.round(60*mult)}s.`)}
 else{const g=Math.min(S.malice*.15,C.P*900)+13;earn(g);toastLine(`Fairy caught: LUCKY! +${fmt(g)} malice.`);floatMap(f.x,f.y-6,'+'+fmt(g),'gold')}
}
function tick(dt){
 calc();
 earn(C.Pf*dt);M.play+=dt;
 for(const k in S.buff)if(S.buff[k]>0)S.buff[k]=Math.max(0,S.buff[k]-dt);
 if(!M.flags.hero&&S.runTotal>=2000&&S.own.slime>=5){M.flags.hero=1;S.heroT=6}
 if(!M.flags.fairy&&S.runTotal>=30000&&M.st.slain>=3){M.flags.fairy=1;S.fairyT=20}
 // the Chosen One is born when this reign crosses the realm's prophecy line
 if(!S.cho&&M.realm<4&&S.startRealm===M.realm&&S.runTotal>=R0().req){S.cho={k:0,base:choBase(),cracks:0,wins:0,t:60};say('chosen');toastLine('A prophecy is fulfilled. The Chosen One has been born, and he is coming for you.',1)}
 if(S.cho&&!S.hero){S.cho.t-=dt;if(S.cho.t<=0)spawnChosen()}
 if(M.flags.hero){
  if(!S.hero){if(!(S.cho&&S.cho.t<25)){S.heroT-=dt;if(S.heroT<=0){spawnHero();if(!M.seen.hero)say('hero')}}}
  else{S.hero.t+=dt/((S.hero.cho?32:22)*(S.up.h3?1.3:1));S.hero.hp-=armyDps()*dt;if(S.hero.hp<=0)heroDefeated();else if(S.hero.t>=1)heroReached()}
 }else if(S.hero){S.hero.t+=dt/32;S.hero.hp-=armyDps()*dt;if(S.hero.hp<=0)heroDefeated();else if(S.hero.t>=1)heroReached()}
 if(M.flags.fairy){
  if(!S.fairy){S.fairyT-=dt*(S.up.f1?2:1)*(1+.25*lv('fairy'));if(S.fairyT<=0){const dir=Math.random()<.5?1:-1;S.fairy={x:dir>0?-4:196,dir,y0:rand(36,100),life:14,ph:Math.random()*6};S.fairyT=rand(70,150);if(!M.seen.fairy)say('fairy')}}
  else{const f=S.fairy;f.life-=dt;f.x+=f.dir*15*dt;f.y=f.y0+Math.sin(M.play*2+f.ph)*12;if(f.life<=0||f.x<-8||f.x>200)S.fairy=null}
 }
}
function buyN(b){return UI.mult||Math.max(1,maxAfford(b))}
function maxAfford(b){const c0=b.cost*costMult()*Math.pow(1.15,S.own[b.id]);return Math.floor(Math.log(1+S.malice*.15/c0)/Math.log(1.15))}
function buy(id){const b=B.find(x=>x.id===id),n=buyN(b),c=bulkCost(b,n);if(S.malice<c)return;S.malice-=c;S.own[id]+=n;if(!M.known[id]){M.known[id]=1;toastLine(`You summoned your first ${b.n}!`)}calc();syncWand();layoutStatics();renderStore(true)}
function buyUp(id){const u=U.find(x=>x.id===id);if(!u||S.up[id]||S.malice<u.cost)return;S.malice-=u.cost;S.up[id]=1;UI.sel=null;calc();renderUps(true)}
function checkAch(){for(const a of ACH)if(!M.ach[a.id]&&a.c()){M.ach[a.id]=1;toastLine(`★ Infamy: ${a.n} (+1% malice)`);if(!M.seen.inf)say('inf')}}
/* Essence grows with the LOG of how far past the line you pushed, so it can't snowball. */
function sealGain(){const Rm=R0();if(S.runTotal<Rm.req)return 0;return Math.floor((5+8*Math.log10(S.runTotal/Rm.req)+2*(S.cho?S.cho.wins:0))*(1+.5*Math.min(M.realm,3))*(1+.1*lv('siphon')))}
function doSeal(){const g=sealGain();M.essence+=g;M.st.essence+=g;M.seals++;S=freshRun();calc();setRealm();UI.sealConfirm=0;UI.storeKey='';UI.upKey='';renderAll(true);return g}
function seal(){if(S.runTotal<R0().req||sealGain()<1)return;doSeal();closeModal();say('reborn',true)}
function forcedSeal(){const g=doSeal();openModal(`<h2>SEALED AWAY</h2><p>The Chosen One drove his sword into your keep, and the old seal closed around you.</p><p>A thousand years pass. You remember everything.</p><p style="color:var(--ess)">+${g} essence</p><p class="note">Spend essence on Dark Arts (✦ at the top), then rise again.</p><button class="pbtn go big" data-act="arts">DARK ARTS</button><button class="pbtn big" data-act="close">RISE AGAIN</button>`)}
function conquer(){
 const was=R0(),bonus=10*(M.realm+1);M.essence+=bonus;M.st.essence+=bonus;M.realm++;S.cho=null;S.hero=null;S.heroT=30;setRealm();UI.storeKey='';
 if(M.realm>3){openModal(`<h2>LIGHTS OUT</h2><p>The Chosen One of the Heavens fell for the last time. Your Sun Snuffer came down, slowly, and the Sun went out with a small, sad <i>fft</i>.</p><p>There is no one left to stop you. There is no one left at all, really. It’s very quiet.</p><p style="color:var(--ess)">+${bonus} essence</p><p class="note">You have conquered everything. Malice ×3 forever. The game goes on; nothing will seal you again.</p><button class="pbtn go big" data-act="close">RULE THE DARK</button>`);return}
 const nx=R0();
 openModal(`<h2>${was.n.toUpperCase()} HAS FALLEN</h2><p>The Chosen One of ${was.title} lies defeated. The realm is yours.</p><p>Your view pulls back. Beyond the borders lies <b style="color:var(--gold);font-weight:400">${nx.title}</b>, and it has never heard of you.</p><p style="color:var(--ess)">+${bonus} essence</p><p class="note">Malice ×3 forever. New minions to summon. The prophecy of ${nx.n} will only be written after your next Sealing: in that reign, a new Chosen One is born at ${fmtL(nx.req)} malice.</p><button class="pbtn go big" data-act="close">ONWARD</button>`);
}

 let h=`<h2>DARK ARTS</h2><p>Essence: <b style="color:var(--ess);font-weight:400">✦ ${fmt(M.essence)}</b></p><p class="note">Every level costs more than the last. Arts last forever, through every Sealing.</p>`;
 let grp='';
 for(const a of ARTS){if(a.g!==grp){grp=a.g;h+=`<h3>${grp.toUpperCase()}</h3>`}
  const l=lv(a.id),maxed=l>=a.max,c=artCost(a);
  h+=`<div class="art"><div class="top"><b>${a.n}</b><span class="lv">${l}/${a.max}</span></div><span>${a.d}</span>${maxed?'<span class="note">Mastered.</span>':`<button class="pbtn ${M.essence>=c?'go':''}" data-act="art" data-arg="${a.id}" ${M.essence<c?'disabled':''}>LEARN · <span class="sym">✦</span>${fmt(c)}</button>`}</div>`}
 return h+'<button class="pbtn go big" data-act="close">CLOSE</button>';
}
function optHTML(){return `<h2>OPTIONS</h2><p class="note">The game saves in this browser every few seconds.</p>
 <p class="note">All-time malice: ${fmtL(M.allTime)} · taps: ${fmtL(M.st.taps)} · heroes defeated: ${M.st.slain} · Chosen One defeats: ${M.st.chosen} · fairies: ${M.st.fairies} · seals: ${M.seals} · essence earned: ${fmt(M.st.essence)} · realms conquered: ${Math.min(M.realm,4)} · played ${ft(M.play)}</p>
 <button class="pbtn big" data-act="save">SAVE NOW</button><button class="pbtn big" data-act="export">COPY SAVE CODE</button>
 <textarea id="imp" placeholder="Paste a save code here"></textarea><button class="pbtn big" data-act="import">LOAD SAVE CODE</button>
 <button class="pbtn big" data-act="${UI.wipe?'wipe2':'wipe'}" style="${UI.wipe?'background:#e5484d;color:#000':''}">${UI.wipe?'TAP AGAIN TO ERASE ALL':'START OVER'}</button>
 <button class="pbtn go big" data-act="close">CLOSE</button>`}

/* ================= INPUT ================= */
$('orb').addEventListener('pointerdown',e=>{
 e.preventDefault();calc();earn(C.click);M.st.taps++;
 const o=$('orb');o.classList.add('bump');setTimeout(()=>o.classList.remove('bump'),70);
 const r=$('core').getBoundingClientRect();floatAt($('core'),e.clientX-r.left-8+rand(-10,10),e.clientY-r.top-20,'+'+fmt(C.click));
 renderTop();
});
mapc.addEventListener('pointerdown',e=>{
 const m=mapRect(),x=(e.clientX-m.r.left-m.ox)/m.s,y=(e.clientY-m.r.top-m.oy)/m.s;
 if(S.fairy&&Math.hypot(x-S.fairy.x,y-S.fairy.y)<12){catchFairy();return}
 if(S.hero){const p=pathAt(S.hero.t);if(Math.hypot(x-p[0],y-(p[1]-4))<12){const d=tapHero();floatMap(p[0]+rand(-4,4),p[1]-14,'-'+fmt(d),'dmg');for(let i=0;i<4;i++)FX.sparks.push({x:p[0]+rand(-3,3),y:p[1]-4+rand(-3,3),l:.5,c:'#c06bff'})}}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,arg=b.dataset.arg;
 switch(a){
  case 'buy':buy(arg);break;
  case 'mult':UI.mult=+arg;break;
  case 'usel':UI.sel=UI.sel===arg?null:arg;break;
  case 'ubuy':buyUp(arg);break;
  case 'seal':UI.sealConfirm=1;break;
  case 'sealx':UI.sealConfirm=0;break;
  case 'seal2':seal();break;
  case 'arts':openModal(artsHTML());break;
  case 'art':{const x=ARTS.find(q=>q.id===arg),c=artCost(x);if(lv(arg)<x.max&&M.essence>=c){M.essence-=c;M.arts[arg]=lv(arg)+1;calc()}const sc=$('mbox').scrollTop;openModal(artsHTML());$('mbox').scrollTop=sc;break}
  case 'inf':openModal(infHTML());break;
  case 'opt':UI.wipe=0;openModal(optHTML());break;
  case 'close':closeModal();break;
  case 'save':save();toastLine('Saved.');break;
  case 'export':{const code=btoa(unescape(encodeURIComponent(JSON.stringify({S,M}))));const ta=$('imp');ta.value=code;ta.select();if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toastLine('Save code copied.'),()=>toastLine('Copy the code from the box.'));break}
  case 'import':{try{const d=JSON.parse(decodeURIComponent(escape(atob($('imp').value.trim()))));if(!adopt(d))throw 0;reset();closeModal();toastLine('Save loaded.')}catch(err){toastLine('That save code didn’t work.',1)}break}
  case 'wipe':UI.wipe=1;openModal(optHTML());break;
  case 'wipe2':M=freshMeta();S=freshRun();reset();closeModal();say('intro');break;
 }
 renderAll(true);
});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function reset(){UI.storeKey='';UI.upKey='';UI.mult=1;UI.sel=null;$('store').innerHTML='';$('mult').dataset.k='';$('mult').innerHTML='';$('choSec').dataset.k='';$('sealSec').dataset.k='';calc();setRealm()}

/* ================= SAVE ================= */
const KEY='dreadkeep-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({S,M,t:Date.now()}))}catch(e){}}
function fill(def,obj){for(const k in def){if(obj[k]===undefined)obj[k]=def[k];else if(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k])&&obj[k]&&typeof obj[k]==='object')fill(def[k],obj[k])}return obj}
function adopt(d){
 if(!d||!d.M)return false;
 if(d.M.v==='dk2'){M=fill(freshMeta(),d.M);S=fill(freshRun(),d.S);return true}
 if(d.M.v==='dk1'){ // old rules: convert runaway essence into the new, slower currency
  const old=d.M;M=fill(freshMeta(),{allTime:old.allTime,seals:old.seals||0,ach:old.ach||{},known:old.known||{},seen:old.seen||{},st:old.st||{},flags:old.flags||{},play:old.play||0});
  M.essence=5+10*(old.seals||0);S=fill(freshRun(),d.S||{});if(M.seals>0)M.seen.migrate=0;return true}
 return false;
}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(adopt(d))return d.t;M=freshMeta();S=freshRun();return null}

/* ================= BOOT ================= */
let started=false;
function start(data){
 if(started)return;started=true;
 let t=null;
 if(data&&data.M&&adopt(data)){}else t=load();
 calc();setRealm();
 if(!M.seen.intro)say('intro');
 if(M.seals>0&&M.seen.migrate===0){M.seen.migrate=undefined;say('migrate')}
 if(t){const el=(Date.now()-t)/1000;if(el>60&&C.P>0){const g=C.P*Math.min(el,86400)*(.5+.1*lv('patient'));earn(g);openModal(`<h2>WHILE YOU SLEPT</h2><p>${ft(Math.min(el,86400))} passed. Your minions gathered <b style="color:var(--mal);font-weight:400">${fmtL(g)}</b> malice.</p><p class="note">Minions work at ${Math.round((.5+.1*lv('patient'))*100)}% speed while you’re away. Heroes, fairies and the Chosen One wait for you to come back.</p><button class="pbtn go big" data-act="close">BACK TO EVIL</button>`)}}
 renderAll(true);
 let last=performance.now();
 setInterval(()=>{const now=performance.now();let dt=Math.min(3600,(now-last)/1000);last=now;while(dt>0){const d=Math.min(.25,dt);tick(d);dt-=d}},100);
 setInterval(()=>renderAll(false),150);
 setInterval(()=>{checkAch();syncWand();layoutStatics()},800);
 setInterval(()=>{if(performance.now()>lastNews)news()},9000);
 setInterval(save,6000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
 window.addEventListener('pagehide',save);
 try{window.claude?.hot?.snapshot?.(()=>({S,M}))}catch(e){}
 let lf=performance.now();
 const frame=now=>{const dt=Math.min(.1,(now-lf)/1000);lf=now;updWand(dt);drawMap(now);drawOrb(now/1000);requestAnimationFrame(frame)};
 requestAnimationFrame(frame);
}
const hot=window.claude?.hot;
if(hot&&hot.ready)hot.ready(start);else start(hot?.data??{});
</script>
</body>
</html>
